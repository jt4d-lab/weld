name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Checks (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: ['20.19', '22', '24']

        steps:
            - uses: actions/checkout@v5

            - run: corepack enable

            - uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node }}
                  cache: yarn

            - run: yarn install --immutable

            - run: yarn verify

    smoke:
        name: Install in project (ESLint ${{ matrix.eslint }})
        runs-on: ubuntu-latest
        needs: verify
        strategy:
            fail-fast: false
            matrix:
                eslint: ['9', '10']

        steps:
            - uses: actions/checkout@v5

            - run: corepack enable

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  cache: yarn

            - run: yarn install --immutable

            - run: yarn smoke ${{ matrix.eslint }}
