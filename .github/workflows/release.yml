name: Release

on:
    push:
        tags:
            - 'v[0-9]+.[0-9]+.[0-9]+'
            - 'v[0-9]+.[0-9]+.[0-9]+-*'
    workflow_dispatch:
        inputs:
            bump:
                description: 'Тип релиза'
                required: true
                type: choice
                default: prerelease
                options:
                    - patch
                    - minor
                    - major
                    - prepatch
                    - preminor
                    - premajor
                    - prerelease
            preid:
                description: 'Идентификатор пререлиза (для pre*-релизов)'
                type: choice
                default: rc
                options:
                    - rc
                    - beta
                    - alpha

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        name: Публикация в npm
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - run: corepack enable

            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: yarn
                  registry-url: https://registry.npmjs.org

            - run: yarn install --immutable

            - run: yarn checks

            - name: Определить версию релиза
              id: version
              env:
                  BUMP: ${{ inputs.bump }}
                  PREID: ${{ inputs.preid }}
              run: |
                  set -euo pipefail

                  if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
                    spec="${GITHUB_REF_NAME#v}"
                  else
                    # База — максимальный тег репозитория, а не ближайший в истории ветки:
                    # после amend/rebase теги остаются на осиротевших коммитах, и бамп от
                    # видимого из ветки тега упирается в уже занятую в npm версию.
                    # versionsort.suffix=- ставит пререлизы перед своим релизом, как в semver.
                    base="$(git -c versionsort.suffix=- tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
                    base="${base:-v0.0.0}"
                    npm version "${base#v}" --no-git-tag-version --allow-same-version >/dev/null

                    spec="$BUMP"
                    echo "База $base, бамп $spec"
                  fi

                  tag="$(npm version "$spec" --preid "$PREID" --no-git-tag-version --allow-same-version)"
                  version="${tag#v}"

                  # Предрелизы (0.1.0-rc.1) не должны занимать dist-tag latest.
                  if [[ "$version" == *-* ]]; then
                    dist_tag=next
                  else
                    dist_tag=latest
                  fi

                  echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"

                  # Заметки к релизу считаем от последнего стабильного тега: иначе после серии rc
                  # в них попадут только изменения с предыдущего rc, а не весь релизный цикл.
                  # Берём максимальный тег репозитория, а не `git describe`: тот видит только
                  # достижимые от HEAD теги, а после amend/rebase они остаются на осиротевших
                  # коммитах — по той же причине, что и база версии выше. Без стартового тега
                  # gh --generate-notes сам возьмёт предыдущий релиз, то есть соседний rc.
                  prev="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v -- '-' | grep -vx -- "$tag" | head -n 1 || true)"
                  echo "Заметки от ${prev:-начала истории}"
                  echo "notes_start_tag=$prev" >> "$GITHUB_OUTPUT"

                  # Итоги — в сводку прогона: она видна и когда публикация упала.
                  {
                    echo "## Релиз $tag"
                    echo
                    echo "| Параметр | Значение |"
                    echo "| --- | --- |"
                    echo "| Версия | \`$version\` |"
                    echo "| dist-tag | \`$dist_tag\` |"
                    if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
                      echo "| Источник версии | тег пуша \`$GITHUB_REF_NAME\` |"
                    else
                      echo "| База | \`$base\` |"
                      echo "| Бамп | \`$BUMP\` (preid \`$PREID\`) |"
                    fi
                    if [[ -n "$prev" ]]; then
                      echo "| Заметки от | \`$prev\` |"
                    else
                      echo "| Заметки от | начала истории |"
                    fi
                    echo "| Коммит | \`$GITHUB_SHA\` |"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Проверить установку собранного пакета
              run: yarn smoke

            - name: npm publish
              run: npm publish --provenance --access public --tag "${{ steps.version.outputs.dist_tag }}"
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Создать GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.version.outputs.tag }}
                  NOTES_START_TAG: ${{ steps.version.outputs.notes_start_tag }}
                  PRERELEASE: ${{ steps.version.outputs.dist_tag == 'next' && '1' || '' }}
              run: |
                  set -euo pipefail

                  args=(--target "$GITHUB_SHA" --title "$TAG" --generate-notes)

                  if [[ -n "$NOTES_START_TAG" ]]; then
                    args+=(--notes-start-tag "$NOTES_START_TAG")
                  fi

                  if [[ -n "$PRERELEASE" ]]; then
                    args+=(--prerelease)
                  fi

                  url="$(gh release create "$TAG" "${args[@]}")"
                  pkg="$(node -p 'require("./package.json").name')"

                  {
                    echo
                    echo "### Опубликовано"
                    echo
                    echo "- npm: https://www.npmjs.com/package/$pkg/v/${TAG#v}"
                    echo "- GitHub Release: $url"
                  } >> "$GITHUB_STEP_SUMMARY"
