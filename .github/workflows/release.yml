name: Release

on:
    push:
        tags:
            - 'v[0-9]+.[0-9]+.[0-9]+'
            - 'v[0-9]+.[0-9]+.[0-9]+-*'
    workflow_dispatch:
        inputs:
            bump:
                description: 'Тип релиза'
                required: true
                type: choice
                default: patch
                options:
                    - patch
                    - minor
                    - major
                    - prepatch
                    - preminor
                    - premajor
                    - prerelease
            preid:
                description: 'Идентификатор пререлиза (для pre*-релизов)'
                type: choice
                default: rc
                options:
                    - rc
                    - beta
                    - alpha

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        name: Публикация в npm
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - run: corepack enable

            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: yarn
                  registry-url: https://registry.npmjs.org

            - run: yarn install --immutable

            - run: yarn checks

            - name: Определить версию релиза
              id: version
              env:
                  BUMP: ${{ inputs.bump }}
                  PREID: ${{ inputs.preid }}
              run: |
                  set -euo pipefail

                  if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
                    spec="${GITHUB_REF_NAME#v}"
                  else
                    base="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 2>/dev/null || echo v0.0.0)"
                    npm version "${base#v}" --no-git-tag-version --allow-same-version >/dev/null

                    spec="$BUMP"
                    echo "База $base, бамп $spec"
                  fi

                  tag="$(npm version "$spec" --preid "$PREID" --no-git-tag-version --allow-same-version)"
                  version="${tag#v}"

                  # Предрелизы (0.1.0-rc.1) не должны занимать dist-tag latest.
                  if [[ "$version" == *-* ]]; then
                    echo "dist_tag=next" >> "$GITHUB_OUTPUT"
                  else
                    echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
                  fi

                  echo "tag=$tag" >> "$GITHUB_OUTPUT"

                  # Заметки к релизу считаем от последнего стабильного тега: иначе после серии rc
                  # в них попадут только изменения с предыдущего rc, а не весь релизный цикл.
                  prev="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' --exclude "$tag" --abbrev=0 2>/dev/null || true)"
                  echo "Заметки от ${prev:-начала истории}"
                  echo "notes_start_tag=$prev" >> "$GITHUB_OUTPUT"

            - name: Проверить установку собранного пакета
              run: yarn smoke

            - name: npm publish
              run: npm publish --provenance --access public --tag "${{ steps.version.outputs.dist_tag }}"
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Создать GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.version.outputs.tag }}
                  NOTES_START_TAG: ${{ steps.version.outputs.notes_start_tag }}
                  PRERELEASE: ${{ steps.version.outputs.dist_tag == 'next' && '1' || '' }}
              run: |
                  set -euo pipefail

                  args=(--target "$GITHUB_SHA" --title "$TAG" --generate-notes)

                  if [[ -n "$NOTES_START_TAG" ]]; then
                    args+=(--notes-start-tag "$NOTES_START_TAG")
                  fi

                  if [[ -n "$PRERELEASE" ]]; then
                    args+=(--prerelease)
                  fi

                  gh release create "$TAG" "${args[@]}"
